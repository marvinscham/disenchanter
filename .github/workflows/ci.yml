name: CI

on:
  push:
    branches-ignore:
      - 'dependabot**'
      - 'release**'
    tags:
      - '*'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build:
    name: Test and Build
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=mod
    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Test
        run: go test -coverprofile=coverage.out ./...

      - name: Vet
        run: go vet ./...

      - name: Check translations
        run: make check-translations

      - name: Build Windows executables
        run: make build-windows

      - name: Run Sonar scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          args: -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  release:
    name: Release
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=mod
      GH_TOKEN: ${{ github.token }}
    permissions:
      contents: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Test
        run: make test

      - name: Vet
        run: make vet

      - name: Check translations
        run: make check-translations

      - name: Build Windows executables
        run: make build-windows

      - name: Create GitHub release
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            build/disenchanter.exe \
            build/disenchanter_up.exe \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes "[Changelog](CHANGELOG.md)"
