[bumpversion]
current_version = 2.0.2
parse = (?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)(-(?P<release>[a-z]+))?
commit = True
tag = True
message = chore(release): bump version {current_version} → {new_version}
serialize = 
	{major}.{minor}.{patch}-{release}
	{major}.{minor}.{patch}

[bumpversion:part:release]
optional_value = gamma
values = 
	beta
	gamma

[bumpversion:file:cmd/disenchanter/main.go]
search = app.Run("v{current_version}")
replace = app.Run("v{new_version}")

[bumpversion:file:Makefile]
search = VERSION ?= v{current_version}
replace = VERSION ?= v{new_version}

[bumpversion:file:sonar-project.properties]
search = sonar.projectVersion=v{current_version}
replace = sonar.projectVersion=v{new_version}
